name: Update results

# Auto-refreshes the official group results in data.js from the openfootball
# public-domain dataset (no API key). When data.js changes, the commit triggers
# the normal GitHub Pages deploy.

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes (UTC)
  workflow_dispatch: {}       # allow manual runs from the Actions tab

# Only one refresh at a time; don't cancel an in-flight commit.
concurrency:
  group: update-results
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest results into data.js
        run: node scripts/update-results.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data.js; then
            echo "No result changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "chore: auto-update group results from openfootball"
          git push
